name: Deploy Presentation to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build All Presentations
        run: |
          mkdir -p site

          build_lesson() {
            DIR=$1
            OUT=$2
            if [ -d "$DIR/apresentacao" ]; then
              echo "=== Building $DIR -> site/$OUT ==="
              cd "$DIR/apresentacao"
              npm ci || npm install
              npm run build
              cd ../..
              mkdir -p "site/$OUT"
              cp -r "$DIR/apresentacao/dist/"* "site/$OUT/"
              if [ -f "$DIR/apresentacao.pdf" ]; then
                cp "$DIR/apresentacao.pdf" "site/$OUT/"
              fi
            fi
          }

          build_lesson "aula_01_introducao_deep_learning" "aula01"
          build_lesson "aula_02_autograd_mlp_churn" "aula02"
          build_lesson "aula_03_pipelines_dados_classificacao_regressao" "aula03"
          build_lesson "aula_04_ciclo_treinamento_classificacao_regressao" "aula04"
          build_lesson "aula_05_estabilidade_inicializacao_regularizacao" "aula05"
          build_lesson "aula_06_otimizacao_diagnostico_tensorboard" "aula06"
          build_lesson "aula_07_introducao_visao_computacional_convolucoes" "aula07"
          build_lesson "aula_08_cnns_profundas_imagens_reais" "aula08"
          build_lesson "aula_09_autoencoders_espaco_latente_anomalias" "aula09"
          build_lesson "aula_10_avaliacao_metricas_desbalanceamento" "aula10"
          build_lesson "aula_11_modelagem_sequencial_series_temporais" "aula11"
          build_lesson "aula_12_lstms_grus_features_ciclicas" "aula12"

          # Copy main portal landing page
          cp site_index.html site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
